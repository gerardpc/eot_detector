[project]
name = "eot-detector"
version = "0.1.0"
description = "End-of-turn detector for the human side of a voice-agent call."
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = [
    "packages/turn_runtime",
    "packages/turn_ui",
    "packages/ml_core",
]

[tool.pytest.ini_options]
testpaths = [
    "packages/turn_runtime/tests",
    "packages/turn_ui/tests",
    "packages/ml_core/tests",
]
addopts = "-p no:warnings"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

