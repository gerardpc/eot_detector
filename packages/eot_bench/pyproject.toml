[project]
name = "happy-robot-eot-bench"
version = "0.1.0"
description = "DualTurn adapter for the official end-of-turn benchmark harness."
requires-python = ">=3.11,<3.14"
dependencies = [
    "happy-robot-turn",
    "numpy>=1.26",
]

[project.optional-dependencies]
harness = [
    "eot-bench @ git+https://github.com/livekit/eot-bench.git",
]

[project.scripts]
happy-robot-eot-bench = "happy_robot_eot_bench.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/happy_robot_eot_bench"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
happy-robot-turn = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
