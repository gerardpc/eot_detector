[project]
name = "eot-ml-core"
version = "0.1.0"
description = "Clip eot-bench-data and train the human-pause head used at runtime."
requires-python = ">=3.11,<3.14"
dependencies = [
    "datasets>=3.0.0",
    "turn-runtime",
    "numpy>=1.26",
    "pydantic>=2.0.0",
    "soundfile>=0.12.1",
    "tensorboard>=2.14.0",
    "torch>=2.7.0",
]

[project.scripts]
eot-prepare = "ml_core.prepare:main"
eot-train = "ml_core.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_core"]

[tool.hatch.build.targets.wheel.force-include]
"src/ml_core/train_dataset_README.md" = "ml_core/train_dataset_README.md"

[tool.uv.sources]
turn-runtime = { workspace = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
