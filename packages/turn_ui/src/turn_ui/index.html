<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>End of turn detector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #071018;
      --panel: #0f1a2b;
      --panel-border: #24364f;
      --text: #e8eef7;
      --muted: #8fa3bb;
      --accent: #7dd3fc;
      --speaking: #34d399;
      --hold: #a78bfa;
      --eot: #38bdf8;
      --node: #132033;
      --node-border: #2a405c;
      font-family: Roboto, ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, #14304a 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    main {
      width: min(1280px, calc(100% - 48px));
      margin: 0 auto;
      padding: 28px 0;
    }
    header {
      text-align: center;
      margin-bottom: 22px;
    }
    h1 {
      margin: 0;
      font-family: Roboto, ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(2.35rem, 4.2vw, 3.1rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.15;
      color: #9ec9e8;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(290px, 360px) minmax(0, 1fr);
      gap: 22px;
      align-items: stretch;
    }
    @media (max-width: 900px) {
      body { align-items: flex-start; }
      .layout { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 20px;
    }
    .flow-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 100%;
    }
    .flow-title {
      margin: 0;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .flow {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: space-between;
      flex: 1;
      gap: 0;
      min-height: 420px;
      font-size: 0.84rem;
    }
    .flow-node {
      text-align: center;
      padding: 12px 12px;
      border: 1px solid var(--node-border);
      background: var(--node);
      color: #c5d3e5;
      border-radius: 12px;
      line-height: 1.35;
      transition: border-color .2s, background .2s, box-shadow .2s, color .2s;
    }
    .flow-node.decision {
      border-radius: 999px;
      border-style: dashed;
      padding: 14px 12px;
    }
    .flow-arrow {
      color: #4a6280;
      font-size: 0.72rem;
      line-height: 1.35;
      text-align: center;
      padding: 10px 0;
      transition: color .2s;
    }
    .flow-arrow .edge {
      display: block;
      color: #6f849c;
      font-size: 0.7rem;
      margin-bottom: 2px;
    }
    .flow-branch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: start;
      flex: 1;
    }
    .flow-col {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 0;
      min-width: 0;
    }
    .flow-node.active {
      color: #fff;
      border-color: currentColor;
      border-style: solid;
      box-shadow: 0 0 0 1px currentColor, 0 0 22px color-mix(in srgb, currentColor 35%, transparent);
      background: color-mix(in srgb, currentColor 18%, var(--node));
    }
    .flow-node[data-node="speaking"].active,
    .flow-node[data-node="loud"].active { color: var(--speaking); }
    .flow-node[data-node="hold"].active { color: var(--hold); }
    .flow-node[data-node="eot"].active { color: var(--eot); }
    .flow-node[data-node="model"].active,
    .flow-node[data-node="gap"].active,
    .flow-node[data-node="pcm"].active { color: var(--accent); }
    .flow-arrow.on { color: #9ec9e8; }
    .flow-arrow.on .edge { color: #b8c7da; }

    .controls {
      display: grid;
      grid-template-columns: auto minmax(180px, 1fr) minmax(180px, 1fr) minmax(160px, 0.9fr);
      gap: 14px 18px;
      align-items: end;
      margin-bottom: 10px;
    }
    @media (max-width: 720px) {
      .controls { grid-template-columns: 1fr 1fr; }
      .controls .field-action { grid-column: 1 / -1; justify-self: start; }
    }
    @media (max-width: 520px) {
      .controls { grid-template-columns: 1fr; }
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }
    .field-action { padding-bottom: 1px; }
    .field > span {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      display: block;
    }
    .field-threshold .threshold-row {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 40px;
    }
    .field-threshold input[type="range"] {
      flex: 1;
      min-width: 0;
      accent-color: var(--accent);
      height: 40px;
      margin: 0;
      cursor: pointer;
    }
    .field-threshold #threshold-value {
      min-width: 2.6em;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      font-size: 0.9rem;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 18px;
      color: #06111e;
      background: var(--accent);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      height: 40px;
    }
    button.stop { background: #fda4af; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    select, input[type="url"] {
      width: 100%;
      background: #0b1627;
      color: var(--text);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 9px 10px;
      font: inherit;
      font-size: 0.9rem;
      height: 40px;
    }
    .model-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 10px;
      margin: 0 0 14px;
    }
    .model-meta .chip {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      padding: 6px 10px;
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      background: #0b1627;
      font-size: 0.78rem;
      color: #d7e2f0;
    }
    .model-meta .chip strong {
      color: var(--muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 0.68rem;
    }
    #error {
      display: none;
      margin: 0 0 12px;
      color: #fda4af;
      font-size: 0.85rem;
    }
    #error.visible { display: block; }
    .meter {
      height: 8px;
      margin: 0 0 14px;
      background: #0a1424;
      border-radius: 99px;
      overflow: hidden;
    }
    #level { display: block; width: 0; height: 100%; background: #38bdf8; }
    .timeline-wrap {
      background: #0b1627;
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 12px;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-bottom: 8px;
    }
    .legend span {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #b8c7da;
      font-size: .78rem;
    }
    .swatch { width: 10px; height: 10px; border-radius: 99px; }
    #timeline { width: 100%; height: 320px; display: block; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>End of turn detector</h1>
  </header>
  <div class="layout">
    <aside class="panel flow-panel" aria-label="Detection pipeline">
      <p class="flow-title">How it decides</p>
      <div class="flow" id="flow">
        <div class="flow-node" data-node="pcm">Human audio</div>
        <div class="flow-arrow" data-edge="pcm-loud">▼</div>
        <div class="flow-node decision" data-node="loud">Frame is loud?</div>
        <div class="flow-branch">
          <div class="flow-col">
            <div class="flow-arrow" data-edge="loud-yes"><span class="edge">yes / &lt;100 ms quiet</span>▼</div>
            <div class="flow-node" data-node="speaking">speaking</div>
          </div>
          <div class="flow-col">
            <div class="flow-arrow" data-edge="loud-no"><span class="edge">quiet ≥ 100 ms</span>▼</div>
            <div class="flow-node decision" data-node="gap">How long quiet?</div>
            <div class="flow-arrow" data-edge="gap-model"><span class="edge">100 ms – 3 s · or ≥ 3 s → eot</span>▼</div>
            <div class="flow-node" data-node="model">Score p(eot)</div>
            <div class="flow-arrow" data-edge="model-out">▼</div>
            <div class="flow-branch">
              <div class="flow-node" data-node="hold"><span class="edge" id="hold-threshold-label" style="display:block;font-size:.65rem;color:#6f849c;margin-bottom:2px">&lt; 0.5</span>hold</div>
              <div class="flow-node" data-node="eot"><span class="edge" id="eot-threshold-label" style="display:block;font-size:.65rem;color:#6f849c;margin-bottom:2px">≥ 0.5</span>eot</div>
            </div>
          </div>
        </div>
      </div>
    </aside>
    <section class="panel">
      <div class="controls">
        <div class="field field-action">
          <button id="toggle">Start listening</button>
        </div>
        <label class="field">
          <span>Model API IP</span>
          <input id="runtime-url" type="url" spellcheck="false" autocomplete="off">
        </label>
        <label class="field">
          <span>ML Model</span>
          <select id="head"></select>
        </label>
        <label class="field field-threshold">
          <span>Detection threshold</span>
          <div class="threshold-row">
            <input id="threshold" type="range" min="0" max="1" step="0.01" value="0.5">
            <span id="threshold-value">0.50</span>
          </div>
        </label>
      </div>
      <div class="model-meta" id="model-meta" aria-live="polite"></div>
      <p id="error" role="alert"></p>
      <div class="meter"><span id="level"></span></div>
      <div class="timeline-wrap">
        <div class="legend" id="legend"></div>
        <canvas id="timeline" width="1000" height="320" aria-label="State probability over time"></canvas>
      </div>
    </section>
  </div>
</main>
<script>
const DEFAULT_RUNTIME_URL = '__RUNTIME_URL__';
const RUNTIME_URL_KEY = 'eot-runtime-url';
const THRESHOLD_KEY = 'eot-threshold';
const DEFAULT_THRESHOLD = 0.5;
const SERIES = [
  {key: 'speaking', label: 'Speaking', color: '#34d399'},
  {key: 'hold', label: 'Hold', color: '#a78bfa'},
  {key: 'eot', label: 'EOT', color: '#38bdf8'},
];
const FLOW_BY_STATE = {
  speaking: {
    nodes: ['pcm', 'loud', 'speaking'],
    edges: ['pcm-loud', 'loud-yes'],
  },
  hold: {
    nodes: ['pcm', 'loud', 'gap', 'model', 'hold'],
    edges: ['pcm-loud', 'loud-no', 'gap-model', 'model-out'],
  },
  eot: {
    nodes: ['pcm', 'loud', 'gap', 'model', 'eot'],
    edges: ['pcm-loud', 'loud-no', 'gap-model', 'model-out'],
  },
};
const ARCH_LABELS = {
  'linear': 'linear (384→1)',
  'linear-64-gelu-linear': 'MLP (384→64→GELU→1)',
};
const POOL_LABELS = {
  mean: 'mean (full clip)',
  tail: 'tail mean',
  ema: 'EMA',
};
const HISTORY = 120;
const history = SERIES.map(() => Array(HISTORY).fill(null));
const headsById = {};
const toggle = document.querySelector('#toggle');
const errorEl = document.querySelector('#error');
const levelEl = document.querySelector('#level');
const headEl = document.querySelector('#head');
const runtimeUrlEl = document.querySelector('#runtime-url');
const thresholdEl = document.querySelector('#threshold');
const thresholdValueEl = document.querySelector('#threshold-value');
const holdThresholdLabel = document.querySelector('#hold-threshold-label');
const eotThresholdLabel = document.querySelector('#eot-threshold-label');
const modelMetaEl = document.querySelector('#model-meta');
const canvas = document.querySelector('#timeline');
const ctx = canvas.getContext('2d');
const legend = document.querySelector('#legend');
const flowEl = document.querySelector('#flow');
let audioContext, source, processor, mute, stream, socket, recording = false;

SERIES.forEach(series => {
  const item = document.createElement('span');
  item.innerHTML = `<i class="swatch" style="background:${series.color}"></i>${series.label}`;
  legend.append(item);
});

function setError(text) {
  if (!text) {
    errorEl.textContent = '';
    errorEl.classList.remove('visible');
    return;
  }
  errorEl.textContent = text;
  errorEl.classList.add('visible');
}

function runtimeOrigin() {
  return (runtimeUrlEl.value.trim() || DEFAULT_RUNTIME_URL).replace(/\/$/, '');
}

function runtimeHttp(path) {
  return `${runtimeOrigin()}${path}`;
}

function runtimeWs(path) {
  const origin = runtimeOrigin();
  const url = new URL(path, origin.endsWith('/') ? origin : `${origin}/`);
  url.protocol = url.protocol === 'https:' ? 'wss:' : 'ws:';
  return url.toString();
}

function highlightFlow(state) {
  const active = FLOW_BY_STATE[state] || FLOW_BY_STATE.hold;
  flowEl.querySelectorAll('[data-node]').forEach(node => {
    node.classList.toggle('active', active.nodes.includes(node.dataset.node));
  });
  flowEl.querySelectorAll('[data-edge]').forEach(edge => {
    edge.classList.toggle('on', active.edges.includes(edge.dataset.edge));
  });
}

function thresholdValue() {
  const value = Number(thresholdEl.value);
  return Number.isFinite(value) ? Math.min(1, Math.max(0, value)) : DEFAULT_THRESHOLD;
}

function applyThresholdUi() {
  const value = thresholdValue();
  thresholdEl.value = String(value);
  thresholdValueEl.textContent = value.toFixed(2);
  holdThresholdLabel.textContent = `< ${value.toFixed(2)}`;
  eotThresholdLabel.textContent = `≥ ${value.toFixed(2)}`;
}

function persistThreshold() {
  localStorage.setItem(THRESHOLD_KEY, String(thresholdValue()));
}

function sendThreshold() {
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({type: 'threshold', value: thresholdValue()}));
  }
}

function chip(label, value) {
  return `<span class="chip"><strong>${label}</strong>${value}</span>`;
}

function parseMetaFromLabel(label) {
  const text = String(label || '');
  const archMatch = text.match(/linear-64-gelu-linear|\blinear\b/);
  const timed = text.match(/\b(tail|ema)-(\d+)ms\b/);
  const mean = /\bmean\b/.test(text);
  return {
    head: archMatch ? archMatch[0] : null,
    pool: timed ? timed[1] : (mean ? 'mean' : null),
    pool_ms: timed ? Number(timed[2]) : null,
  };
}

function selectedMeta() {
  let fromApi = {...(headsById[headEl.value] || {})};
  const label = headEl.options[headEl.selectedIndex]?.textContent || '';
  if (!fromApi.head) {
    const linked = label.match(/current \(([^)]+)\)/);
    if (linked && headsById[linked[1]]) {
      fromApi = {...headsById[linked[1]], ...fromApi};
    }
  }
  const fromLabel = parseMetaFromLabel(label);
  // Prefer structured /heads fields; fall back to parsing the option label
  // when an older runtime is still running without head/pool/pool_ms.
  const head = fromApi.head ?? fromLabel.head;
  const pool = fromApi.pool ?? fromLabel.pool ?? 'mean';
  const pool_ms = fromApi.pool_ms ?? fromLabel.pool_ms ?? 1000;
  return {head, pool, pool_ms};
}

function renderModelMeta() {
  const meta = selectedMeta();
  const archKey = meta.head;
  const poolKey = meta.pool || 'mean';
  const poolMs = Number(meta.pool_ms);
  const architecture = ARCH_LABELS[archKey] || archKey || 'unknown';
  const pool = POOL_LABELS[poolKey] || poolKey;
  const length = poolKey === 'mean'
    ? 'full clip'
    : (Number.isFinite(poolMs) ? `${Math.round(poolMs)} ms` : '—');
  modelMetaEl.innerHTML = [
    chip('Architecture', architecture),
    chip('Pool', pool),
    chip('Length', length),
  ].join('');
}

function pushHistory(state, pEot) {
  const speaking = state === 'speaking' ? 1 : 0;
  const eot = state === 'speaking' ? 0 : Math.min(1, Math.max(0, Number(pEot) || 0));
  const hold = state === 'speaking' ? 0 : 1 - eot;
  const values = [speaking, hold, eot];
  SERIES.forEach((_, i) => {
    history[i].push(values[i]);
    if (history[i].length > HISTORY) history[i].shift();
  });
}

function drawTimeline() {
  const dpr = window.devicePixelRatio || 1, width = canvas.clientWidth, height = canvas.clientHeight;
  canvas.width = width * dpr; canvas.height = height * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = '#071018'; ctx.fillRect(0, 0, width, height);
  const left = 72, right = 12, top = 10, bottom = 28;
  const plotW = width - left - right, plotH = height - top - bottom;
  const windowSeconds = 30;
  ctx.strokeStyle = '#1e334d'; ctx.lineWidth = 1; ctx.font = '11px Roboto, system-ui'; ctx.fillStyle = '#6f849c';
  [0, 0.5, 1].forEach(tick => {
    const y = top + plotH * (1 - tick);
    ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(left + plotW, y); ctx.stroke();
    ctx.textAlign = 'right'; ctx.fillText(tick.toFixed(1), left - 8, y + 4);
  });
  for (let sec = 0; sec <= windowSeconds; sec += 5) {
    const x = left + plotW * (sec / windowSeconds);
    ctx.beginPath();
    ctx.moveTo(x, top);
    ctx.lineTo(x, top + plotH);
    ctx.strokeStyle = sec === 0 || sec === windowSeconds ? '#2a405c' : '#1e334d';
    ctx.stroke();
    ctx.fillStyle = '#6f849c';
    ctx.textAlign = sec === windowSeconds ? 'right' : (sec === 0 ? 'left' : 'center');
    const label = sec === windowSeconds ? 'now' : `${windowSeconds - sec}s`;
    ctx.fillText(label, x, height - 8);
  }
  ctx.save();
  ctx.translate(14, top + plotH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#6f849c';
  ctx.fillText('state probability', 0, 0);
  ctx.restore();
  SERIES.forEach((series, s) => {
    const points = [];
    for (let i = 0; i < HISTORY; i++) {
      const value = history[s][i];
      if (value == null) continue;
      points.push([left + plotW * (i / (HISTORY - 1)), top + plotH * (1 - value)]);
    }
    if (points.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(points[0][0], top + plotH);
    points.forEach(([x, y]) => ctx.lineTo(x, y));
    ctx.lineTo(points[points.length - 1][0], top + plotH);
    ctx.closePath();
    ctx.fillStyle = series.color + '33';
    ctx.fill();
    ctx.beginPath();
    points.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.strokeStyle = series.color;
    ctx.lineWidth = 2;
    ctx.stroke();
  });
}

function applyEvent(payload) {
  const state = payload.state || 'hold';
  const pEot = Number(payload.p_eot) || 0;
  highlightFlow(state);
  pushHistory(state, pEot);
  drawTimeline();
}

async function loadHeads() {
  const response = await fetch(runtimeHttp('/heads'));
  const payload = await response.json();
  headEl.innerHTML = '';
  Object.keys(headsById).forEach(key => delete headsById[key]);
  (payload.heads || []).forEach(item => {
    headsById[item.id] = item;
    const option = document.createElement('option');
    option.value = item.id;
    option.textContent = item.label;
    if (item.id === (payload.selected || 'current')) option.selected = true;
    headEl.append(option);
  });
  if (!headEl.value) {
    const option = document.createElement('option');
    option.value = 'current';
    option.textContent = 'current';
    option.selected = true;
    headEl.append(option);
    headsById.current = {id: 'current', head: null, pool: 'mean', pool_ms: 1000};
  }
  renderModelMeta();
}

headEl.addEventListener('change', () => {
  renderModelMeta();
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({type: 'head', id: headEl.value}));
  }
});

thresholdEl.addEventListener('input', () => {
  applyThresholdUi();
  persistThreshold();
  sendThreshold();
});

runtimeUrlEl.addEventListener('change', () => {
  localStorage.setItem(RUNTIME_URL_KEY, runtimeOrigin());
  loadHeads().catch(() => {
    headEl.innerHTML = '<option value="current" selected>current</option>';
    Object.keys(headsById).forEach(key => delete headsById[key]);
    headsById.current = {id: 'current', head: null, pool: 'mean', pool_ms: 1000};
    renderModelMeta();
  });
});

function connectSocket(sampleRate) {
  socket = new WebSocket(runtimeWs('/ws'));
  socket.binaryType = 'arraybuffer';
  socket.onmessage = event => {
    const payload = JSON.parse(event.data);
    if (payload.state) applyEvent(payload);
  };
  socket.onerror = () => setError('Live stream unavailable');
  return new Promise((resolve, reject) => {
    socket.onopen = () => {
      socket.send(JSON.stringify({
        type: 'start',
        sampleRate,
        head: headEl.value || 'current',
        threshold: thresholdValue(),
      }));
      resolve();
    };
    socket.onclose = () => { if (recording) setError('Live stream closed'); };
    setTimeout(() => reject(new Error('websocket timeout')), 4000);
  });
}

async function start() {
  toggle.disabled = true;
  setError('');
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: {channelCount: 1}});
    audioContext = new AudioContext();
    await connectSocket(audioContext.sampleRate);
    source = audioContext.createMediaStreamSource(stream);
    processor = audioContext.createScriptProcessor(4096, 1, 1);
    mute = audioContext.createGain(); mute.gain.value = 0;
    processor.onaudioprocess = event => {
      const input = event.inputBuffer.getChannelData(0);
      let energy = 0; for (const x of input) energy += x * x;
      levelEl.style.width = `${Math.min(100, Math.sqrt(energy / input.length) * 300)}%`;
      if (socket && socket.readyState === WebSocket.OPEN) socket.send(Float32Array.from(input).buffer);
    };
    source.connect(processor); processor.connect(mute); mute.connect(audioContext.destination);
    recording = true;
    runtimeUrlEl.disabled = true;
    toggle.disabled = false; toggle.textContent = 'Stop listening'; toggle.classList.add('stop');
  } catch (error) {
    toggle.disabled = false;
    setError(`Cannot start: ${error.message}`);
  }
}

function stop() {
  recording = false;
  if (socket) { socket.close(); socket = null; }
  if (processor) processor.disconnect(); if (source) source.disconnect(); if (mute) mute.disconnect();
  if (stream) stream.getTracks().forEach(track => track.stop());
  if (audioContext) audioContext.close();
  runtimeUrlEl.disabled = false;
  toggle.textContent = 'Start listening'; toggle.classList.remove('stop');
  levelEl.style.width = '0';
  setError('');
  highlightFlow('hold');
}

toggle.addEventListener('click', () => recording ? stop() : start());
window.addEventListener('resize', drawTimeline);
runtimeUrlEl.value = localStorage.getItem(RUNTIME_URL_KEY) || DEFAULT_RUNTIME_URL;
const savedThreshold = Number(localStorage.getItem(THRESHOLD_KEY));
thresholdEl.value = String(Number.isFinite(savedThreshold) ? savedThreshold : DEFAULT_THRESHOLD);
applyThresholdUi();
loadHeads().catch(() => {
  headEl.innerHTML = '<option value="current" selected>current</option>';
  headsById.current = {id: 'current', head: null, pool: 'mean', pool_ms: 1000};
  renderModelMeta();
});
highlightFlow('hold');
drawTimeline();
</script>
</body>
</html>
