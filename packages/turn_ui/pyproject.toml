[project]
name = "turn-ui"
version = "0.1.0"
description = "Browser UI for the human-side end-of-turn runtime."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic-settings>=2.11.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
turn-ui = "turn_ui.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turn_ui"]

[tool.hatch.build.targets.wheel.force-include]
"src/turn_ui/index.html" = "turn_ui/index.html"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

