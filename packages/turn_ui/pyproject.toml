[project]
name = "happy-robot-ui"
version = "0.1.0"
description = "FastAPI browser UI for live DualTurn output."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "happy-robot-turn",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
happy-robot-ui = "happy_robot_ui.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/happy_robot_ui"]

[tool.uv.sources]
happy-robot-turn = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

