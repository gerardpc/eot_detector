[project]
name = "turn-runtime"
version = "0.1.0"
description = "Live end-of-turn runtime for human audio in voice-agent calls."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "huggingface-hub>=0.30.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26",
    "pydantic-settings>=2.11.0",
    "safetensors>=0.5.0",
    "soundfile>=0.12.1",
    "torch>=2.7.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
turn-runtime = "turn_runtime.cli:main"
turn-runtime-serve = "turn_runtime.app:run"
turn-runtime-stress = "turn_runtime.stress:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turn_runtime"]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
