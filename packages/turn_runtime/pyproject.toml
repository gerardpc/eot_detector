[project]
name = "happy-robot-turn"
version = "0.1.0"
description = "Lazy DualTurn audio inference runtime."
requires-python = ">=3.11,<3.14"
dependencies = [
    "huggingface-hub>=0.30.0",
    "numpy>=1.26",
    "safetensors>=0.5.0",
    "soundfile>=0.12.1",
    "torch>=2.7.0",
    "torchaudio>=2.7.0",
    "transformers>=4.50.0",
]

[project.scripts]
happy-robot-turn = "happy_robot_turn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/happy_robot_turn"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

